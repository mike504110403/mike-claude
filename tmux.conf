# 極簡自維護設定（2026-08-07 重建；不裝 oh-my-tmux）

# prefix 改 C-a（不合手感就刪掉這三行回到 C-b）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on                      # 滑鼠捲動/選 pane/拖分割線
set -g history-limit 50000
set -g base-index 1                  # window 從 1 起算，對齊鍵盤
setw -g pane-base-index 1
set -g renumber-windows on

# Claude Code 必備
set -g allow-passthrough on          # 桌面通知穿透
set -s extended-keys on              # Shift+Enter 可辨識
set -as terminal-features 'xterm*:extkeys'
set -g default-terminal "tmux-256color"

# 好記的分割鍵（prefix + | 左右分、prefix + - 上下分，沿用當前目錄）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 真彩色（狀態列 hex 色需要）
set -as terminal-overrides ',*:RGB'

# ── 狀態列（Tokyo Night Moon 色盤，深→淺分層）───────────
# 底：#1e2030（比終端機背景 #222436 再深一層）
# 段：#222436 / #2f334d（越亮越靠前）
# 亮點：藍 #82aaff、青 #86e1fc、琥珀 #b08b57（prefix 提示）
set -g status-position top
set -g status-style "bg=#1e2030,fg=#828bb8"
set -g status-left-length 200
set -g status-right-length 60
set -g window-status-separator ""

# 左：session 膠囊（加寬版）；按住 prefix（C-a）時變黃，放開變回藍
set -g status-left "#{?client_prefix,#[fg=#1e2030#,bg=#b08b57#,bold],#[fg=#c8d3f5#,bg=#2f334d#,bold]}                                    #S                                    #[default]  #[fg=#ffc777,bold]#(~/.claude/bin/phase show \"#S\")#[default]"

# window 分頁不顯示（只有一個 window 時是雜訊；要找回來刪掉這兩行）
set -g window-status-format ""
set -g window-status-current-format ""

# 右：當前目錄 ▸ 日期 ▸ 時間，一段比一段亮
set -g status-right "#[fg=#2f334d]#{b:pane_current_path}  #[fg=#636da6,bg=#222436] %m/%d #[fg=#828bb8,bg=#2f334d] %H:%M "
set -g status-interval 5

# ── pane 邊框：非作用中幾乎隱形，作用中稍亮 ──────────────
set -g pane-border-style "fg=#2f334d"
set -g pane-active-border-style "fg=#636da6"

# ── 訊息列 / copy-mode / 雜項同色系 ─────────────────────
set -g message-style "bg=#82aaff,fg=#1e2030,bold"
set -g message-command-style "bg=#ffc777,fg=#1e2030"
set -g mode-style "bg=#2f334d,fg=#c8d3f5"
set -g copy-mode-match-style "bg=#2f334d,fg=#c8d3f5"
set -g copy-mode-current-match-style "bg=#ffc777,fg=#1e2030"
set -g clock-mode-colour "#82aaff"
set -g clock-mode-style 24
set -g display-panes-colour "#636da6"
set -g display-panes-active-colour "#82aaff"

# 手動改的 window 名稱不被 shell 蓋回
set -g allow-rename off
